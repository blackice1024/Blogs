# ===================================================================
# 博客站点配置 —— 账号 blackice1024 / 仓库 Blogs（项目站点）
# 线上地址: https://blackice1024.github.io/Blogs/
# 主题: PaperMod（submodule，themes/PaperMod）
# ===================================================================

# 项目站点必须带仓库名前缀 /Blogs/，末尾保留斜杠
baseURL = 'https://blackice1024.github.io/Blogs/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = '网内人'
timeZone = 'Asia/Shanghai'

theme = 'PaperMod'

# 文章默认分组
[taxonomies]
  tag = 'tags'
  category = 'categories'

# 图片缓存目录（CI 下使用 :cacheDir）
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  description = '记录游戏客户端开发学习与工程复盘'
  author = '网内人'
  # 首页信息模式（关闭 profile 头像区，走文章列表）
  profileMode.enabled = false
  # 文章目录
  ShowToc = true
  # 自动折叠目录
  TocOpen = false

[menus]
  [[menus.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 1
  [[menus.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menus.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 3
  [[menus.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 4
